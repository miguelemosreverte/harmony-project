  <path class="e build" d="M560 240 L560 290"/>
  <text class="lo" x="570" y="268">app DARs</text>
  <path class="e build" d="M820 372 L890 372"/>
  <text class="lo" x="855" y="362" text-anchor="middle">fetch</text>
