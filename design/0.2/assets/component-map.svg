  <text class="li" x="621" y="146" text-anchor="middle">back-office</text>
  <text class="lo" x="621" y="161" text-anchor="middle">exec views</text>
  <rect class="sub" x="686" y="128" width="114" height="42"/>
  <text class="li" x="743" y="146" text-anchor="middle">tx submit</text>
  <text class="lo" x="743" y="161" text-anchor="middle">DAR fetch</text>
  <rect class="sub" x="320" y="180" width="480" height="42"/>
  <text class="li" x="560" y="198" text-anchor="middle">reads state + package metadata · writes workflow tx</text>
  <text class="lo" x="560" y="213" text-anchor="middle">interaction surface · not the orchestration layer</text>


  <rect class="node nodeoff" x="380" y="290" width="440" height="170" rx="8"/>
  <text class="t" x="400" y="318">harmonia-builder</text>
  <text class="st" x="400" y="334">internal tooling · BUILD TIME ONLY</text>
  <rect class="sub" x="400" y="348" width="128" height="42"/>
  <text class="li" x="464" y="366" text-anchor="middle">DAR upload</text>
  <text class="lo" x="464" y="381" text-anchor="middle">user-supplied</text>
  <rect class="sub" x="536" y="348" width="128" height="42"/>
  <text class="li" x="600" y="366" text-anchor="middle">DAR retrieval</text>
  <text class="lo" x="600" y="381" text-anchor="middle">pkg mgr · validator</text>
  <rect class="sub" x="672" y="348" width="128" height="42"/>
  <text class="li" x="736" y="366" text-anchor="middle">codegen</text>
  <text class="lo" x="736" y="381" text-anchor="middle">project + boilerplate</text>
