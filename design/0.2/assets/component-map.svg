  <path class="cut" d="M20 505 L1420 505"/>
  <rect x="1050" y="492" width="320" height="26" rx="13" fill="#0b0f14" stroke="#3d4f61"/>
  <text class="band" x="1210" y="509" text-anchor="middle" fill="#8fa3b8">LEDGER BOUNDARY · LEDGER API</text>


  <rect class="bandon" x="20" y="520" width="1400" height="460" rx="14"/>
  <text class="band" x="42" y="548" fill="#4ade80">ON-LEDGER · DAML</text>
  <text class="st" x="220" y="548">hosted by Canton Validator / Super Validator (external) · composition state stays on-ledger</text>


  <rect class="node nodeon" x="50" y="600" width="400" height="330" rx="8"/>
  <text class="t" x="70" y="628">harmonia-core</text>
  <text class="st" x="70" y="644">Daml · the Core-managed workflow model</text>
  <rect class="subon" x="70" y="658" width="174" height="40"/>
  <text class="li" x="157" y="675" text-anchor="middle">orchestration</text>
  <text class="lo" x="157" y="689" text-anchor="middle">templates · choices</text>
  <rect class="subon" x="256" y="658" width="174" height="40"/>
  <text class="li" x="343" y="675" text-anchor="middle">interfaces</text>
  <text class="lo" x="343" y="689" text-anchor="middle">+ applicability</text>
  <rect class="subon" x="70" y="706" width="174" height="40"/>
  <text class="li" x="157" y="723" text-anchor="middle">workflow state</text>
  <text class="lo" x="157" y="737" text-anchor="middle">persisted · queryable</text>
  <rect class="subon" x="256" y="706" width="174" height="40"/>
  <text class="li" x="343" y="723" text-anchor="middle">step-exec rules</text>
  <text class="lo" x="343" y="737" text-anchor="middle">actor + authority</text>
  <rect class="subon" x="70" y="754" width="360" height="40"/>
  <text class="li" x="250" y="771" text-anchor="middle">sequential · XOR branch · join · continuation</text>
  <text class="lo" x="250" y="785" text-anchor="middle">start event → steps → end event</text>
  <rect class="subon" x="70" y="802" width="360" height="40"/>
  <text class="li" x="250" y="819" text-anchor="middle">bounded atomic execution block</text>
  <text class="lo" x="250" y="833" text-anchor="middle">collapse steps when authorizations co-exist</text>
  <rect class="subon" x="70" y="850" width="360" height="40"/>
  <text class="li" x="250" y="867" text-anchor="middle">role → party binding · no central operator</text>
  <text class="lo" x="250" y="881" text-anchor="middle">privacy · ownership · authorization preserved</text>


  <rect class="node nodeon" x="545" y="600" width="305" height="330" rx="8"/>
