  <text class="li" x="1190" y="117">runtime call</text>
  <path class="e build" d="M1130 136 L1180 136"/>
  <text class="li" x="1190" y="141">build-time</text>
  <path class="e on" d="M1130 160 L1180 160"/>
  <text class="li" x="1190" y="165">on-ledger relation</text>
