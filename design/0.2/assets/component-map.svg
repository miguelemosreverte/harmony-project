  <text class="li" x="600" y="418" text-anchor="middle">output → Binding DAR + generated project/code</text>
  <text class="lo" x="600" y="433" text-anchor="middle">no separate runtime composition model</text>


  <rect class="node ext" x="890" y="290" width="250" height="170" rx="8"/>
  <text class="t" x="1015" y="322" text-anchor="middle" fill="#f0a04c">Package Manager</text>
  <text class="st" x="1015" y="338" text-anchor="middle">external · e.g. Catalyx</text>
  <rect class="sub" x="910" y="352" width="210" height="26"/>
  <text class="li" x="1015" y="369" text-anchor="middle">DARs</text>
