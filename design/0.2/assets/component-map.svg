  <rect class="subon" x="565" y="710" width="265" height="44"/>
  <text class="li" x="698" y="728" text-anchor="middle">participation in the model</text>
  <text class="lo" x="698" y="743" text-anchor="middle">which step kind a choice fulfils</text>
  <rect class="subon" x="565" y="762" width="128" height="58"/>
  <text class="num" x="629" y="783" text-anchor="middle" fill="#4ade80">①</text>
  <text class="lo" x="629" y="798" text-anchor="middle">authored by</text>
  <text class="lo" x="629" y="811" text-anchor="middle">app project</text>
  <rect class="subon" x="702" y="762" width="128" height="58"/>
  <text class="num" x="766" y="783" text-anchor="middle" fill="#f0a04c">②</text>
  <text class="lo" x="766" y="798" text-anchor="middle">emitted by</text>
  <text class="lo" x="766" y="811" text-anchor="middle">harmonia-builder</text>
  <rect class="subon" x="565" y="828" width="265" height="44"/>
  <text class="xs" x="698" y="846" text-anchor="middle" fill="#f0a04c">import direction · templateId repr</text>
  <text class="xs" x="698" y="860" text-anchor="middle" fill="#f0a04c">binding mechanism — UNDECIDED</text>
  <text class="lo" x="698" y="894" text-anchor="middle">both paths → one Core-managed model</text>


  <rect class="node nodeon" x="912" y="600" width="265" height="155" rx="8"/>
  <text class="t2" x="932" y="626">Source App DAR ①</text>
  <text class="st" x="932" y="641">final DAR · new version</text>
