      <figcaption id="architecture-description" class="sr-only">
        <h1>Harmonia architecture</h1>
        <h2>Components and boundaries</h2>
        <p>The Dapp inspects, composes and submits through the Ledger API. Builder is build-time tooling that produces a Binding DAR and generated code. Inputs can come from DAR upload, Package Manager or Validator. The Canton Validator or Super Validator hosts the on-ledger Daml packages. Core owns workflow state and step rules. Bounded atomic execution requires suitable workflow structure and authorizations.</p>
        <p>The smaller Binding DAR declaration has two independent connections to vertically arranged application packages. Direct integration uses a new application DAR implementing the interfaces. Generated integration binds an existing unchanged application DAR. The packages are not connected to each other. Each application keeps its authority, ownership and visibility. The references package demonstrates the model. Source: original architecture, section 1.</p>
        <h2>Contract relationships</h2>
        <p>A definition creates instances. An instance contains state, outputs and role-to-party bindings, and assigns steps to actors. For a choice-exercise step, the step interface reaches an application choice with the application's own authority and observers. Applicability relates step kind, choice and role. Instance outputs can continue to a next definition. Both Continuation and Next definition appear inside the Core workflow model boundary. The two applicability relations are labeled qualifies and selects choice. Source: original architecture, section 2; contract names are illustrative.</p>
        <p>This revised architecture overview is a generated prototype for joint review. Package imports, binding mechanism and interface placement remain open in the proposal. Source citations, the exact edit prompt, inspection and review history are recorded in design-v2.md.</p>
      </figcaption>
