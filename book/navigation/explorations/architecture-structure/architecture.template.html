<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <title>Harmonia architecture — reading draft</title>
  <style>
    * { box-sizing: border-box; }
    html { color: #162944; background: #f5f8fc; }
    body { margin: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    header { padding: 14px 24px; border-bottom: 1px solid #dee7f2; color: #526783; font-size: 13px; }
    main { max-width: 820px; margin: 32px auto 64px; padding: 44px 56px; background: white; border: 1px solid #e0e9f3; border-radius: 12px; }
    h1 { margin: 0 0 12px; color: #132c50; font-size: 34px; line-height: 1.2; letter-spacing: -.03em; }
    h2 { margin: 32px 0 12px; color: #132c50; font-size: 23px; line-height: 1.3; letter-spacing: -.015em; }
    p { margin: 0 0 16px; font-size: 18px; line-height: 1.6; }
    strong { font-weight: 620; }
    em { font-style: normal; color: #526783; }
    p:has(> img:only-child) { margin: 22px 0; }
    img { display: block; width: 100%; max-width: 540px; height: auto; margin-inline: auto; }
    a { color: #183254; text-decoration-thickness: 1px; text-underline-offset: 3px; }
    a:hover { color: #126ac1; }
    a:focus-visible { outline: 2px solid #167cf0; outline-offset: 3px; }
    hr { margin: 32px 0 18px; border: 0; border-top: 1px solid #dee7f2; }
    hr + p { color: #526783; font-size: 15px; }
    main > :last-child { margin-bottom: 0; }
    @media (max-width: 680px) {
      html { background: white; }
      header { padding: 12px 22px; }
      main { margin: 0; padding: 28px 22px 48px; border: 0; border-radius: 0; }
      h1 { font-size: 29px; }
      h2 { margin-top: 28px; font-size: 21px; }
      p { font-size: 17px; }
    }
    @media print {
      @page { size: A4; margin: 18mm; }
      html { background: white; }
      header { display: none; }
      main { max-width: none; margin: 0; padding: 0; border: 0; }
      h1 { font-size: 23pt; }
      h2 { font-size: 14pt; break-after: avoid; }
      p { font-size: 11pt; line-height: 1.45; widows: 3; orphans: 3; }
      p:has(> img:only-child) { break-inside: avoid; break-after: avoid; }
      img { max-height: 70mm; width: auto; max-width: 100%; margin: auto; }
      hr + p { font-size: 9pt; }
    }
  </style>
</head>
<body>
  <header>Harmonia · Reading draft</header>
  <main>
{{content}}
  </main>
</body>
</html>
