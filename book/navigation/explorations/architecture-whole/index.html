  <header><strong>Architecture · complete candidate 03</strong><span>Original proposal</span></header>
  <main id="viewport" tabindex="0" aria-label="Complete architecture sheet. Pan and zoom to inspect." aria-describedby="navigation-help">
    <figure id="paper">
      <img src="03-complete.png?v=719a19bd4534" width="1448" height="1086" draggable="false"
        alt="Harmonia architecture: independent applications share one on-ledger workflow. Four diagrams show where it runs, two participation paths, step execution, and cooperation across independently owned domains."
        aria-describedby="architecture-description">
      <figcaption id="architecture-description" class="sr-only">
        <h1>Independent applications. One on-ledger workflow.</h1>
        <h2>Where it runs</h2>
        <p>The Dapp inspects, composes and submits through the Ledger API. Canton hosts the Daml packages: Harmonia Core holds workflow state and step rules; applications retain their own rules, ownership and visibility. The Binding DAR declares participation. Source: original architecture, section 1.</p>
        <h2>Two ways to participate</h2>
        <p>An application can implement the interfaces in a new DAR. Alternatively, the build-time Builder uses an existing unchanged application DAR and produces a Binding DAR and generated code. Both participate in one Core-managed model. DAR upload, Package Manager and Validator are possible inputs. Source: original architecture, section 1.</p>
        <h2>From definition to application action</h2>
        <p>A definition creates an instance with state, outputs and role-to-party bindings. The instance assigns a step with an actor and target choice. For a choice-exercise step, a step interface connects to the application choice, which still requires the application's authority. Applicability declares step kind, choice and role. Instance outputs can continue to a next definition. Source: original architecture, section 2; contract names are illustrative.</p>
        <h2>Across independently owned domains</h2>
        <p>In financing, a bank decides on evidence under its own rules. Rejection ends that path. Approval enables the buyer to create a proposal in a separate offer workflow, with buyer and seller agents relaying it. In the four-party transfer, Buyer and Seller agree, the source custodian validates a lock and the destination custodian confirms readiness. Bounded atomic execution requires the necessary authorizations, lock conditions and compatible workflow structure; otherwise coordination is staged. Settler is one of those four parties. Source: proposal, Illustrative Execution Flows.</p>
        <p>Scope: sequence, exclusive branches and joins, bounded wait, continuation, bounded atomic blocks. Open design includes package imports, template identifiers, binding mechanism and interface placement. This is a presentation of the proposal, not measured implementation coverage.</p>
      </figcaption>
